version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: garjane_postgres
    environment:
      POSTGRES_USER: garjane
      POSTGRES_PASSWORD: garjane_dev_password
      POSTGRES_DB: garjane_news
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garjane -d garjane_news"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: